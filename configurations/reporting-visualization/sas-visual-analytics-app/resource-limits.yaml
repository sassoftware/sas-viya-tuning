---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-visual-analytics-app-resource-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/cpu
    value: 1500m
target:
  group: apps
  kind: Deployment
  name: sas-visual-analytics-app
  version: v1
