---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-report-execution-resource-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/memory
    value: 6Gi
target:
  group: apps
  kind: Deployment
  name: sas-report-execution
  version: v1
