---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-job-execution-app-resource-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/memory
    value: 1Gi
target:
  group: apps
  kind: Deployment
  name: sas-job-execution-app
  version: v1
