---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-model-publish-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/cpu
    value: 1000m
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/memory
    value: 1Gi
target:
  group: apps
  kind: Deployment
  name: sas-model-publish
  version: v1
