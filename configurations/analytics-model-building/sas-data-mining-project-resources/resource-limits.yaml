---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-data-mining-project-resources-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/cpu
    value: 2000m
target:
  group: apps
  kind: Deployment
  name: sas-data-mining-project-resources
  version: v1
