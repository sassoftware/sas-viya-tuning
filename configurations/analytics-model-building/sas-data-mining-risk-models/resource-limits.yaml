---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-data-mining-risk-models-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/cpu
    value: 1000m
target:
  group: apps
  kind: Deployment
  name: sas-data-mining-risk-models
  version: v1
