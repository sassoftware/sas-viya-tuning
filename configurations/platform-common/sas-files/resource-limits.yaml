---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-files-resource-limits-tuning
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/cpu
    value: 2000m
  - op: replace
    path: /spec/template/spec/containers/0/resources/limits/memory
    value: 3Gi
target:
  group: apps
  kind: Deployment
  name: sas-files
  version: v1
