
# LDAP Connection Pooling
config/identities/sas.identities.providers.ldap.connection/pool.maxActive: 30
config/identities/sas.identities.providers.ldap.connection/pool.maxIdle: 30

# JDBC Connection Pooling
config/application/sas.deployment.springdatasource.defaults: large

# JVM Tuning
config/authorization/jvm/java_option_xmx: -XX:MaxRAMPercentage=75
config/files/jvm/java_option_xmx: -XX:MaxRAMPercentage=75
config/identities/jvm/java_option_xmx: -XX:MaxRAMPercentage=75
config/SASLogon/jvm/java_option_xmx: -XX:MaxRAMPercentage=75
config/SASLogon/jvm/java_option_xms: -Xms1024m
