###############################################################################
# Kustomize patch configuration to change settings for all Crunchy PostgreSQL
# pod resources.  This patch will be ignored if the PostgresCluster CRD does 
# not exist.
#
# See {deploy-dir}/sas-bases/examples/crunchydata/pod-resources/README.md for
# more information.
###############################################################################
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-crunchy-resource-limits-tuning
patch: |-
   - op: replace
     path: /spec/instances/0/resources
     value:
       limits:
         cpu: 12
         memory: 14Gi

   - op: replace
     path: /spec/backups/pgbackrest/repoHost/resources
     value:
       limits:
         cpu: 12
         memory: 14Gi
target:
  group: postgres-operator.crunchydata.com
  kind: PostgresCluster
