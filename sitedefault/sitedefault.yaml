
# LDAP Connection Pooling
config/identities/sas.identities.providers.ldap.connection/pool.maxActive: 30
config/identities/sas.identities.providers.ldap.connection/pool.maxIdle: 30

# JDBC Connection Pooling
config/application/sas.deployment.springdatasource.defaults: large

# JVM Tuning
config/authorization/jvm/java_option_xmx: -Xmx2048m
config/files/jvm/java_option_xmx: -Xmx1024m
config/identities/jvm/java_option_xmx: -Xmx512m
config/jobExecution/jvm/java_option_xmx: -Xmx1024m
config/SASLogon/jvm/java_option_xmx: -Xmx2048m
config/SASLogon/jvm/java_option_xms: -Xmx2048m

# Launcher Memory and CPU Tuning
config/launcher/sas.launcher.default/cpu.limit: 8
config/launcher/sas.launcher.default/cpu.request: 2
config/launcher/sas.launcher.default/memory.limit: 8Gi
config/launcher/sas.launcher.default/memory.request: 2Gi
config/launcher/sas.launcher.max/cpu.limit: 8
config/launcher/sas.launcher.max/cpu.request: 2
config/launcher/sas.launcher.max/memory.limit: 8Gi
config/launcher/sas.launcher.max/memory.request: 2Gi

# Analytics
config/application/sas.analytics.execution/maximum.concurrent.node.execution: 50
